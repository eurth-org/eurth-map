<!DOCTYPE html>
<html>
  <head>
    <title>Eurth Map & Measurement</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no"/>
    
    <!-- 1. Core Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 2. Leaflet.PolylineMeasure Plugin (For visual A->B->C lines & unit switching) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.polylinemeasure@3.0.0/Leaflet.PolylineMeasure.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet.polylinemeasure@3.0.0/Leaflet.PolylineMeasure.js"></script>
    
    <style>
      html, body, #map { 
          width: 100%; 
          height: 100%; 
          margin: 0; 
          padding: 0; 
          background-color: #050505; 
      }
    </style>
  </head>
  <body>
    
    <div id="map"></div>
    
    <script>
      // Initialize the Leaflet Map
      var map = L.map('map', {
          crs: L.CRS.EPSG4326,
          center: [0, 0],
          zoom: 1,
          minZoom: 0,
          maxZoom: 3,
          worldCopyJump: false // <--- TURN THIS OFF!
      });

      // Load your working .jpg tiles
      L.tileLayer('{z}/{x}/{y}.png', {
          noWrap: false, // This will ensure the tiles still repeat endlessly
          attribution: 'Eurth.org'
      }).addTo(map);

      // Add the visual Measurement Plugin
      L.control.polylineMeasure({
          position: 'topleft',
          unit: 'kilometres',
          showUnitControl: true,
          showClearControl: true,
          clearMeasurementsOnStop: false
      }).addTo(map);
    </script>
    
  </body>
</html>
